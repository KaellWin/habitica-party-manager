name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock
      - run: ruff check hpm tests scripts
      - run: pytest --cov=hpm --cov-report=term-missing
      - run: docker compose -f compose.demo.yaml up -d --build
      - run: python scripts/check_demo.py
      - if: always()
        run: docker compose -f compose.demo.yaml down
